[package]
name = "modoc"
version = "0.2.0"
edition = "2021"
authors = ["Arzzos <razzofwar@gmail.com>"]
description = "Professional CLI tool for interacting, monitoring, and simulating Modbus TCP/RTU communications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arzzos/modoc"
readme = "README.md"
keywords = ["modbus", "cli", "industrial", "tcp", "rtu"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
tokio-modbus = { version = "0.14", features = ["tcp", "rtu"] }
tokio-serial = "5.4"
serialport = "4.4"
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.1"

[lib]
name = "modoc"
path = "src/lib.rs"

[[bin]]
name = "modoc"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1